[project]
name = "contract-starter"
version = "0.1.0"
description = "Engineering starter template for AI-assisted contract work."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Start broad; graduate rules out of AGENTS.md into here as they become checkable.
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = []

[tool.mypy]
# Strict from the start (workflow-v1 decision): cheap on greenfield, relax per-module if it bites.
strict = true
python_version = "3.11"
files = ["src", "tests"]
warn_unused_configs = true
warn_return_any = true
show_error_codes = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
